name: Presentation QA
on:
  push:
    branches: [main, fix/v28.1-presentation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original runtime images
        run: python3 tools/restore_archives.py
      - name: Check JavaScript syntax
        run: |
          printf '{"type":"module"}\n' > /tmp/ashen-module.json
          find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run presentation regression tests when present
        run: |
          if [ -f tests/presentation-v281.test.mjs ]; then
            node --test tests/presentation-v281.test.mjs
          fi
      - name: Export exact runtime for visual review
        run: |
          mkdir -p qa-export
          git rev-parse HEAD > qa-export/COMMIT.txt
          tar -czf qa-export/ashen-runtime.tar.gz dist source tools README.md BACKUP_STATUS.md AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-runtime-${{ github.sha }}
          path: qa-export/
          retention-days: 7
          compression-level: 0
