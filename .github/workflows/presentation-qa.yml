name: Presentation QA
on:
  push:
    branches: [main, fix/v28.1-presentation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/fix/v28.1-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize checksum-verified V28.1 changes and refinements
        id: transfer
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, lzma, zlib, subprocess, os
          folder=Path('tools/v281-transfer')
          active=folder.exists()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('active='+str(active).lower()+'\n')
          if not active:
              raise SystemExit(0)
          packed=b''.join((folder/f'part{i:02}').read_bytes() for i in range(1,8))
          assert hashlib.sha256(packed).hexdigest()=='83bbcc2e784db39c674c707e3aa4ada25a7219b0a2f18bd8d154af4e8e67b054'
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='2658430b0512e7252a8c381218dd41ddccbc14e31d979f64e89edd2218e3dfa6'
          payload=json.loads(raw)
          subprocess.run(['git','merge-base','--is-ancestor',payload['base_commit'],'HEAD'],check=True)
          paths=[]
          def apply(entry,refinement=False):
              rel=PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              assert rel.parts[0] in {'dist','source','docs','tests','tools','README.md','BACKUP_STATUS.md'}
              if refinement:
                  assert str(rel) in paths
              p=Path(rel)
              if entry['old_sha256'] is None:
                  assert not p.exists(), str(p)+' unexpectedly exists'
                  text=entry['content']
              else:
                  original=p.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==entry['old_sha256'],str(p)+' baseline mismatch'
                  text=original.decode('utf-8')
                  for start,end,replacement in reversed(entry['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              encoded=text.encode('utf-8')
              assert hashlib.sha256(encoded).hexdigest()==entry['new_sha256'],str(p)+' result mismatch'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(encoded)
              if not refinement:
                  paths.append(str(rel))
          for entry in payload['files']:
              apply(entry)
          refined=zlib.decompress(b''.join((Path('tools/v281-refinement')/f'part{i:02}').read_bytes() for i in range(1,10)))
          assert hashlib.sha256(refined).hexdigest()=='e19f5fb6c408b0c5b3232c4098c91dbc4bc472cf70cfbd6d8b5b3a8124d6c9f3'
          for entry in json.loads(refined)['files']:
              apply(entry,True)
          Path('/tmp/ashen-v281-paths.json').write_text(json.dumps(paths))
          subprocess.run(['git','add','--',*paths],check=True)
          print('Verified and materialized',len(paths),'files including final refinements')
          PY
      - name: Restore original runtime images
        run: python3 tools/restore_archives.py
      - name: Build transparent derivative atlases
        if: steps.transfer.outputs.active == 'true'
        run: |
          python3 -m pip install 'Pillow==12.0.0'
          python3 tools/build_presentation_assets.py
      - name: Install Chinese font support for browser screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Check every JavaScript module
        run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run presentation regression tests
        run: |
          mkdir -p qa-export
          set -o pipefail
          node --test tests/presentation-v281.test.mjs | tee qa-export/node-tests.txt
      - name: Run actual HTTP Chromium scenes and visual gallery
        run: node tests/browser-presentation-v281.mjs
      - name: Record evidence and publish tested candidate
        if: steps.transfer.outputs.active == 'true'
        env:
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os, re, shutil, subprocess
          browser=json.loads(Path('qa-export/browser/BROWSER_QA.json').read_text())
          tap=Path('qa-export/node-tests.txt').read_text()
          passed=int(re.search(r'^# pass (\d+)$',tap,re.M).group(1))
          assert passed==23 and re.search(r'^# fail 0$',tap,re.M)
          assert not browser['uncaught_errors'] and not browser['chapter8_cg_requests']
          now=datetime.now(timezone.utc).isoformat()
          evidence=Path('docs/v28.1/screenshots');evidence.mkdir(parents=True,exist_ok=True)
          for p in Path('qa-export/browser').glob('*.png'):
              shutil.copy2(p,evidence/p.name)
          report={'version':'28.1','checked_at_utc':now,'workflow_run_id':os.environ['QA_RUN_ID'],'candidate_parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'node_tests_passed':passed,'browser':browser,'site_deployed':False,'full_manual_eight_chapter_playthrough':False}
          Path('docs/v28.1/QA_REMOTE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          p=Path('source/CURRENT_STATE.json');state=json.loads(p.read_text())
          state.update(checked_at_utc=now,browser_interaction_retested=True,browser_qa_status='passed: real HTTP Chromium title, class previews, chapter checkpoints, chapter 8 narration and portraits, and actual-renderer gallery; not a complete playthrough',runtime_resource_bytes=sum(f.stat().st_size for f in Path('dist').rglob('*') if f.is_file()))
          state['v28_1']['node_tests_passed']=passed
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          with Path('source/progress.txt').open('a') as f:
              f.write('\n'+now+' · V28.1 远端验收\n23 项 Node 测试通过；完整 HTTP Chromium 加载、三职业预览、后续章节入口、四段第八章旁白/对白及正式渲染器画廊检查通过。第八章小立绘保留，无大图请求，无未捕获异常。证据：docs/v28.1/QA_REMOTE.json 与 screenshots/。本轮没有发布原站，也没有声称完成八章人工通关。\n')
          paths=json.loads(Path('/tmp/ashen-v281-paths.json').read_text())
          subprocess.run(['git','add','--',*paths,'dist/assets/v281','docs/v28.1/QA_REMOTE.json','docs/v28.1/screenshots','source/CURRENT_STATE.json','source/progress.txt'],check=True)
          subprocess.run(['git','rm','-r','--','tools/v281-transfer','tools/v281-refinement'],check=True)
          PY
          git config user.name Tourist
          git config user.email 138776726+YuxiangLiu-lyx@users.noreply.github.com
          git diff --cached --stat
          git commit -m "fix: ship V28.1 art and presentation repairs"
          git push origin HEAD:fix/v28.1-presentation
      - name: Export diagnostic runtime and source even on test failure
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p qa-export
          git rev-parse HEAD > qa-export/RESULT_COMMIT.txt
          printf '%s\n' "$JOB_STATUS" > qa-export/JOB_STATUS.txt
          git diff HEAD --binary > qa-export/CANDIDATE_CHANGES.patch
          tar -czf qa-export/ashen-v28.1-runtime.tar.gz dist source tools tests docs/v28.1 README.md BACKUP_STATUS.md AGENTS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-v281-qa-${{ github.run_id }}
          path: qa-export/
          retention-days: 7
          compression-level: 0
  main-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/restore_archives.py
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tests/presentation-v281.test.mjs
      - run: node tests/browser-presentation-v281.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-main-qa-${{ github.run_id }}
          path: qa-export/
          retention-days: 7
