name: Build playable webpage
on:
  push:
    branches: [build/web-play]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashen-web-play
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dist/
            /source/
            /tools/
            /tests/
            /web/
            /.github/
            /docs/
            /README.md
            /BACKUP_STATUS.md
            /AGENTS.md
            /.gitignore
            /archives/runtime-assets*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare builder and UI regression tests
        run: python3 tools/web_play_ci.py prepare
      - name: Restore game art and install build dependencies
        run: |
          python3 tools/restore_archives.py
          python3 -m pip install 'Pillow==12.0.0' 'playwright==1.57.0'
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Build static website and offline HTML
        run: python3 tools/build_web_play.py --output web-build
      - name: Verify original game and packaged modules
        run: |
          mkdir -p qa-export
          node --test tests/presentation-v281.test.mjs > qa-export/original-tests.txt
          find web-build/site -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Play packaged file and HTTP game in Chrome
        run: python3 tests/browser-web-play.py --build web-build --out qa-export/web-play
      - name: Publish tested static website without rewriting history
        id: publish
        run: python3 tools/web_play_ci.py publish
      - name: Verify public preview in Chrome
        id: public
        continue-on-error: true
        run: python3 tests/browser-web-play.py --remote '${{ steps.publish.outputs.url }}' --out qa-export/public-web
      - name: Preserve actual sources and publication receipts
        env:
          PUBLIC_RESULT: ${{ steps.public.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: python3 tools/web_play_ci.py record
      - name: Export artifacts and diagnostic sources
        if: always()
        run: |
          mkdir -p qa-export
          cp web-build/WEB_BUILD_MANIFEST.json qa-export/ 2>/dev/null || true
          tar -czf qa-export/web-builder-sources.tar.gz web/launcher.html tools/build_web_play.py tests/browser-web-play.py tools/web_play_ci.py .github/workflows/web-play.yml
          if [ -f web-build/Ashen-V28.1-Play.html ]; then zip -j -6 qa-export/Ashen-V28.1-Offline.zip web-build/Ashen-V28.1-Play.html; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-playable-web-${{ github.run_id }}
          path: qa-export/
          retention-days: 7
          compression-level: 0
