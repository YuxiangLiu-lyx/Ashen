<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一章地图对照 · Ashen</title><style>[hidden]{display:none!important}body{margin:0;background:#141d1a;color:#e4ddca;font:16px/1.6 system-ui}main{max-width:1360px;margin:auto;padding:24px}h1{margin:0;font-size:26px}p{color:#afbab1}select,button{background:#263c33;color:#eee3c9;border:1px solid #697c6c;padding:9px;margin:4px;border-radius:5px;font:inherit}figure{margin:18px 0;position:relative}img{width:100%;display:block}figcaption{padding:12px;background:#203229}input{width:100%}.compare{position:relative}.over{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{font-size:14px;color:#acb9ac}a{color:#92d9c8}</style><main><h1>第一章0.8 · 自然场景与任务交接</h1><p>野外与试炼采用连通空场，城镇与工作间保留开阔空间。选择地图查看正式游戏渲染，以及同一碰撞规则的可达图。</p><div class="row"><select id="maps" aria-label="地图"></select><button id="current">当前地图</button><button id="collision">碰撞与可达</button><button id="compare">改前对照</button></div><p id="note"></p><figure><div class="compare"><img id="base"><img id="overlay" class="over"></div><input id="slider" type="range" min="0" max="100" value="50" aria-label="前后对照分界"><figcaption id="caption"></figcaption></figure><p class="muted">改前图来自保留的0.7场景记录；当前图来自0.8正式渲染器。五张新地图没有改前截图。绿色为可达足点，红色为碰撞；不以截图推断真人游玩时长。<a href="ACCEPTANCE.md">验收记录</a> · <a href="ASSETS.json">新素材来源</a></p></main><script>const rows=[{"id": "hall", "name": "灰烛会馆", "before": "../ch1-map-quests/visual/hall.webp"}, {"id": "warehouse", "name": "旧库房", "before": "../ch1-map-quests/visual/warehouse.webp"}, {"id": "road", "name": "旧王道", "before": "../ch1-map-quests/visual/road.webp"}, {"id": "town", "name": "白榆城", "before": "../ch1-map-quests/visual/town.webp"}, {"id": "chapel", "name": "礼拜厅", "before": "../ch1-map-quests/visual/chapel.webp"}, {"id": "alley", "name": "北门小巷", "before": "../ch1-map-quests/visual/alley.webp"}, {"id": "canal", "name": "北门水渠", "before": "../ch1-map-quests/visual/canal.webp"}, {"id": "grove", "name": "溪边旧径", "before": "../ch1-map-quests/visual/grove.webp"}, {"id": "guestroom", "name": "会馆客房", "before": "../ch1-map-quests/visual/guestroom.webp"}, {"id": "millpath", "name": "旧磨坊小径", "before": "../ch1-map-quests/visual/millpath.webp"}, {"id": "echo", "name": "回水机房", "before": "../ch1-map-quests/visual/echo.webp"}, {"id": "workshop", "name": "白榆修理铺", "before": "../ch1-map-quests/visual/workshop.webp"}, {"id": "c1TrainingYard", "name": "灰烛练武庭", "before": "../ch1-map-quests/visual/c1TrainingYard.webp"}, {"id": "c1DrillGallery", "name": "旧试炼廊", "before": "../ch1-map-quests/visual/c1DrillGallery.webp"}, {"id": "c1LoomRoom", "name": "缀纹工坊", "before": "../ch1-map-quests/visual/c1LoomRoom.webp"}, {"id": "c1NorthWalk", "name": "北渠检修道", "before": "../ch1-map-quests/visual/c1NorthWalk.webp"}, {"id": "c1ReedKiln", "name": "苇湾废窑", "before": "../ch1-map-quests/visual/c1ReedKiln.webp"}, {"id": "c1TrialFoyer", "name": "地下接待室", "before": null}, {"id": "c1TrialCrypt", "name": "地下蓄能廊", "before": null}, {"id": "c1TrialVault", "name": "封存库", "before": null}, {"id": "c1RiversideCamp", "name": "河畔营地", "before": null}, {"id": "c1KilnCourt", "name": "窑工院", "before": null}];const sel=document.querySelector('#maps'),base=document.querySelector('#base'),over=document.querySelector('#overlay'),slider=document.querySelector('#slider');for(const r of rows)sel.add(new Option(r.name,r.id));let mode='current';function show(){const r=rows.find(x=>x.id===sel.value),compare=mode==='compare'&&r.before;base.src=compare?r.before:'visual/'+r.id+(mode==='collision'?'-collision':'')+'.webp';over.src='visual/'+r.id+'.webp';over.hidden=!compare;slider.hidden=!compare;document.querySelector('#caption').textContent=r.name+(compare?' · 左：当前0.8 / 右：改前0.7':mode==='collision'?' · 真实RPG碰撞覆盖':' · 当前0.8');document.querySelector('#note').textContent=mode==='compare'&&!r.before?'本图无同格式改前截图，显示当前正式渲染。':compare?'拖动分界对比布局和物件。':'出口以实物路牌、门或阶梯表示，游戏右上角用文字列出方向。';}sel.onchange=show;for(const key of ['current','collision','compare'])document.querySelector('#'+key).onclick=()=>{mode=key;show()};slider.oninput=()=>over.style.clipPath='inset(0 '+(100-slider.value)+'% 0 0)';show();</script></html>
