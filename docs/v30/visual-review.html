<style>body{margin:0;background:#171d21;color:#e4dfd1;font:16px system-ui}main{max-width:1440px;margin:30px auto;padding:0 24px}h1{font-size:27px}p{color:#b9bcb5;line-height:1.7}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:22px 0}select{padding:10px;background:#283339;color:inherit;border:1px solid #697066;border-radius:6px}.compare{position:relative;width:100%;aspect-ratio:1440/980;background:#10151a;overflow:hidden}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 50% 0 0)}.line{position:absolute;left:50%;height:100%;border-left:2px solid #dbc5a3;pointer-events:none}.tag{position:absolute;top:18px;background:#141b22bb;padding:7px 11px;border-radius:4px}.left{left:16px}.right{right:16px}input{width:100%;margin:20px 0}a{color:#d7bf91}footer{margin:24px 0;color:#929d9f;font-size:14px}</style>
<main><h1>第一章 · 场景改造对照</h1><p>同一真实游戏渲染器、同一地图与镜位。拖动滑杆：左侧为V30，右侧为改造前V29。这是隔离场景全景截图；连续试玩记录与验收范围另见说明。</p><nav><label>场景 <select id="map"></select></label><a href="REVIEW_AND_PLAN.md">问题与方向</a><a href="RELEASE.md">改动与验收</a><a href="GENERATION.json">资产生成说明</a></nav><div class="compare"><img id="before" alt="V29改造前场景"><img id="after" class="after" alt="V30改造后场景"><div class="line"></div><span class="tag left">V30 · 改造后</span><span class="tag right">V29 · 改造前</span></div><label for="slider">前后对照位置</label><input id="slider" type="range" min="0" max="100" value="50"><footer>4张环境图集＋16帧守卫动作图集；原图、地图拓扑与战斗数值保留。GitHub保存不等于原网站更新。</footer></main>
<script>const maps={hall:'灰烛会馆',warehouse:'旧库房',road:'旧王道',town:'白榆城',chapel:'礼拜厅',alley:'侧巷',canal:'旧水渠',grove:'林地',millpath:'旧磨坊小径',echo:'回水机房',workshop:'修理铺'};const choose=document.querySelector('#map'),before=document.querySelector('#before'),after=document.querySelector('#after'),slider=document.querySelector('#slider');for(const[id,name]of Object.entries(maps)){const o=new Option(name,id);choose.add(o)}function show(){before.src='before/'+choose.value+'.png';after.src='after/'+choose.value+'.png'}choose.onchange=show;slider.oninput=()=>{after.style.clipPath='inset(0 '+(100-slider.value)+'% 0 0)';document.querySelector('.line').style.left=slider.value+'%'};show();</script></html>
